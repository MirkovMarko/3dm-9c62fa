<!doctype html>
<!--
  3DM — NOVI INTERFEJS (nova.html)
  ================================================================
  OVO JE NOVI FAJL. STARI PROGRAM JE index.html I NE SME DA SE MENJA OVDE.
  Od v1.3 upisuje SAMO preko funkcija lager_prijem, lager_popis, primi_nabavku_raspodela, sacuvaj_podesavanja (uvek uz potvrdu). Čita istu bazu (Supabase auwkcdfsflhptaggasbv). Ništa ne upisuje u bazu.
  Uputstvo za izmene u bilo kom chatu: NOVI-INTERFEJS.md (u projektu).
  Sve što se najčešće menja je u bloku CONFIG odmah ispod skripte.
-->
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DM Odluka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Radionica noću: tamno plavo-ljubičasta pozadina, a jedini jaki element je sjaj lampe u boji semafora. */
:root{
  --bg:#eceff6;--card:#ffffff;--card2:#f4f6fb;--line:#dde2ee;--ink:#141a2e;--mut:#5f6b88;
  --g:#12915a;--y:#b87400;--r:#d93a40;--gs:#1fbf7a;--ys:#f2a81d;--rs:#f0484e;
  --glow:.28;--c1:#5b7cff;--c2:#8f6bff;--c3:#ff7aa8;--c4:#9aa4bd;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
:root[data-t="dark"]{--bg:#0f1426;--card:#171e36;--card2:#1d2646;--line:#2a3558;--ink:#eef1fa;--mut:#9aa6c6;--g:#3ddc97;--y:#ffb938;--r:#ff5a5f;--gs:#3ddc97;--ys:#ffb938;--rs:#ff5a5f;--glow:.5;--c4:#6f7ba0}
@media(prefers-color-scheme:dark){:root:not([data-t="light"]){--bg:#0f1426;--card:#171e36;--card2:#1d2646;--line:#2a3558;--ink:#eef1fa;--mut:#9aa6c6;--g:#3ddc97;--y:#ffb938;--r:#ff5a5f;--gs:#3ddc97;--ys:#ffb938;--rs:#ff5a5f;--glow:.5;--c4:#6f7ba0}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:500 17px/1.4 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px var(--disp);letter-spacing:-.01em;margin-right:auto}
.bulb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ys)}
.bulb svg{width:20px;height:20px}
select,.ibtn{font:700 16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;height:44px}
select{padding-right:6px;max-width:170px}
.ibtn{width:44px;padding:0;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
select:focus-visible,.ibtn:focus-visible,button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
h1{font:800 30px/1.1 var(--disp);letter-spacing:-.02em;margin:4px 0 14px}
h2{font:700 17px/1.2 var(--body);margin:0 0 10px}
.pg-sec{display:none}.pg-sec.on{display:block}
.g2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.g2>div{min-width:0}
@media(min-width:900px){.g2{grid-template-columns:1.15fr 1fr;align-items:start}.lgrid{grid-template-columns:1fr 1fr}.wrap{padding-top:28px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 8px;margin-bottom:16px}
.panel>h2{margin-bottom:6px}
.mut{color:var(--mut)}.sm{font-size:14px;color:var(--mut)}

/* HERO: sjaj lampe u boji semafora */
.hero{--sig:var(--g);--sigs:var(--gs);position:relative;overflow:hidden;border-radius:30px;padding:30px 24px 26px;margin-bottom:16px;background:var(--card);border:1px solid var(--line)}
.hero.y{--sig:var(--y);--sigs:var(--ys)}.hero.r{--sig:var(--r);--sigs:var(--rs)}
.hero .glow{position:absolute;right:-110px;top:-150px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--sigs) 0%,transparent 66%);opacity:var(--glow);pointer-events:none}
.hero.r .glow{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:calc(var(--glow)*.7)}50%{opacity:var(--glow)}}
@media(prefers-reduced-motion:reduce){.hero.r .glow{animation:none}}
.hero .st{position:relative;font:800 64px/.95 var(--disp);letter-spacing:-.03em;color:var(--sig);margin:0 0 12px}
.hero p{position:relative;margin:0;font:700 22px/1.25 var(--body);max-width:30ch}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font:700 15px var(--body);padding:7px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.chip.r{border-color:var(--r);color:var(--r)}.chip.y{border-color:var(--y);color:var(--y)}

/* Za danas */
.todo{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.who{flex:0 0 auto;min-width:44px;text-align:center;font:800 15px var(--disp);padding:8px 0;border-radius:12px}
.who.ti{background:color-mix(in srgb,var(--ys) 22%,transparent);color:var(--y)}
.who.ja{background:color-mix(in srgb,var(--c1) 20%,transparent);color:var(--c1)}
.todo b{display:block;font:700 19px/1.25 var(--body)}
.todo span{display:block;font-size:15px;color:var(--mut);margin-top:3px}

/* Novac: jedna traka, tri polja */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:16px;overflow:hidden}
.strip>div{padding:16px 14px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip small{display:block;font-size:13px;color:var(--mut);min-height:34px;line-height:1.25}
.strip b{display:block;font:800 25px/1.1 var(--disp);letter-spacing:-.02em;margin-top:4px}
.strip em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:4px}
@media(max-width:420px){.strip b{font-size:22px}.strip>div{padding:14px 10px}}
@media(min-width:900px){.strip b{font-size:28px}}
.big{font:800 44px/1 var(--disp);letter-spacing:-.03em}
.big small{font:600 18px var(--body);color:var(--mut);letter-spacing:0}
.track{position:relative;height:14px;border-radius:99px;background:var(--card2);margin:14px 0 8px;border:1px solid var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--g))}
.track u{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink);opacity:.7}
.line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line b{font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.seg{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--card2);margin:10px 0 6px}
.seg i{display:block;height:100%}

/* Lager */
.lgrid{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .nm{font:800 20px var(--disp)}
.pill{font:800 13px var(--body);padding:4px 11px;border-radius:99px}
.pill.r{background:color-mix(in srgb,var(--rs) 20%,transparent);color:var(--r)}
.pill.y{background:color-mix(in srgb,var(--ys) 22%,transparent);color:var(--y)}
.pill.g{background:color-mix(in srgb,var(--gs) 20%,transparent);color:var(--g)}
.item .big{margin:8px 0 2px;font-size:38px}
.days{height:8px;border-radius:99px;background:var(--card2);margin:10px 0 6px;overflow:hidden}
.days i{display:block;height:100%;border-radius:99px}
.item.r .days i{background:var(--r)}.item.y .days i{background:var(--y)}.item.g .days i{background:var(--g)}
.act{margin-top:10px;padding:11px 13px;border-radius:14px;font:700 16px/1.3 var(--body);background:var(--card2)}
.item.r .act{background:color-mix(in srgb,var(--rs) 14%,transparent)}
.item.y .act{background:color-mix(in srgb,var(--ys) 16%,transparent)}
.act p{margin:0}.act p+p{margin-top:5px}
.nap{font-size:14px;color:var(--mut);margin-top:8px}
.incoming{border-color:var(--ys);margin-bottom:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font:800 20px var(--body);padding:14px;margin:12px 0 8px;cursor:pointer}
:root[data-t="dark"] .btn,:root:not([data-t="light"]) .btn{color:#06210f}
@media(prefers-color-scheme:light){:root:not([data-t="dark"]) .btn{color:#fff}}
.btn.btn.ghost,:root .btn.ghost{color:var(--mut)!important}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font:700 14px var(--body);padding:10px}
details{margin:6px 0 12px}
summary{cursor:pointer;color:var(--mut);font-size:14px;font-weight:700;padding:6px 0}
details p{font-size:14px;color:var(--mut);margin:6px 0}

/* Narudžbine */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .big{font-size:36px}
.tile div:last-child{font-size:14px;color:var(--mut);margin-top:4px}
.tile.faint{opacity:.65}

/* Reklame */
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;margin:12px 0 6px}
.bars i{flex:1;min-width:3px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--c3),var(--c2));min-height:3px}

/* Rolne filamenta */
.fil{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.fil:first-of-type{border-top:0}
.rolls{display:flex;flex-wrap:wrap;gap:4px;flex:0 0 132px}
.rolls svg{width:40px;height:40px}
.fil .nm{font:800 18px var(--disp)}
.fil .sm b{color:var(--ink)}
/* Reklame po proizvodu */
.prod{margin-bottom:16px}
.cr{padding:14px 0 6px;border-top:1px solid var(--line)}
.cr .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cr .nm{font:800 18px var(--disp)}
.vrd{font:700 17px var(--body);margin:8px 0 2px}
.vrd.g{color:var(--g)}.vrd.y{color:var(--y)}.vrd.r{color:var(--r)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.nums div{background:var(--card2);border-radius:14px;padding:9px 10px}
.nums small{display:block;font-size:12px;color:var(--mut)}
.nums b{display:block;font:800 18px var(--disp)}
.nums em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.pbars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:14px 0 4px}
.pbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pbars i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--c3),var(--c2));min-height:2px}
.pbars span{font:800 12px var(--body);color:var(--g);margin-bottom:2px;min-height:15px}
/* Plan */
.wk{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk b{flex:0 0 96px;font:800 16px var(--disp)}

/* Dock */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:9;width:calc(100% - 24px);max-width:520px}
nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--mut);font:700 12px var(--body);padding:8px 2px;border-radius:18px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{background:var(--ink);color:var(--bg)}
.foot{font-size:13px;color:var(--mut);margin-top:22px;line-height:1.5}
.foot a,a.lnk{color:var(--mut)}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;background:var(--ink);color:var(--bg);font:700 15px var(--body);padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
/* Prijava */
#login{display:none;max-width:380px;margin:12vh auto;padding:18px}
#login .panel{padding-bottom:18px}
#login input{width:100%;font:600 18px var(--body);padding:13px;margin:6px 0;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
#err{color:var(--r);font-size:15px;min-height:20px}
</style>
</head>
<body>
<div id="login">
  <div class="brand" style="margin-bottom:14px"><span class="bulb" id="lb"></span>3DM</div>
  <div class="panel">
    <h2>Prijava</h2>
    <input id="em" type="email" placeholder="E-pošta" autocomplete="username">
    <input id="pw" type="password" placeholder="Šifra" autocomplete="current-password">
    <button class="btn" onclick="prijava()">Prijavi se</button>
    <div id="err"></div>
    <div class="sm">Ista prijava kao u starom programu.</div>
  </div>
</div>

<div id="app" style="display:none">
<div class="wrap">
  <header>
    <div class="brand"><span class="bulb" id="hb"></span>3DM</div>
    <select id="mesec" onchange="promeniMesec(this.value)" aria-label="Mesec"></select>
    <button class="ibtn" onclick="osvezi()" aria-label="Osveži podatke" id="rf"></button>
    <button class="ibtn" onclick="go('p-pod')" aria-label="Podešavanja" id="gear"></button>
  </header>
  <section id="p-odluka" class="pg-sec on"></section>
  <section id="p-lager" class="pg-sec"></section>
  <section id="p-novac" class="pg-sec"></section>
  <section id="p-nar" class="pg-sec"></section>
  <section id="p-rek" class="pg-sec"></section>
  <section id="p-plan" class="pg-sec"></section>
  <section id="p-pod" class="pg-sec"></section>
  <div class="foot" id="foot"></div>
</div>
<nav id="nav"></nav>
<div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function nf(x,dec){return Number(x).toLocaleString('de-DE',{maximumFractionDigits:dec||0});}
function fd(d){return DN[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function isWork(d){var w=d.getDay();return w>=1&&w<=5;}
function prevWork(d){var x=add(d,-1);while(!isWork(x))x=add(x,-1);return x;}
function nextWork(d){var x=add(d,1);while(!isWork(x))x=add(x,1);return x;}
function same(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();}
function dmy(d){var p=function(n){return String(n).padStart(2,'0');};return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear();}
function isoToDate(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function monthOf(d){return MN[d.getMonth()]+' '+d.getFullYear();}
function monthKey(m){var p=String(m).split(' ');return (+p[1])*12+MN.indexOf(p[0]);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dmyIso(d){var p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function isoToDmy(s){return String(s||'').slice(0,10).split('-').reverse().join('.');}

function capOf(d){var k=(D.settings&&D.settings.kapacitet_po_danu)||CONFIG.CAP;return Number(k[d]!=null?k[d]:(CONFIG.CAP[d]||0));}
function setx(){var s=D.settings||{};return {post:typeof s.postarina==='number'?s.postarina:390,
  mat:(s.proizvodi&&s.proizvodi[0]&&s.proizvodi[0].cena)||900,
  fiksni:(s.fiksni_troskovi||[]).reduce(function(a,f){return a+(+f.mesecno||0);},0),
  cilj:s.cilj_mesecni||150000,prag:typeof s.prag_povrata==='number'?s.prag_povrata:0.05};}
function qtyOf(p){var m=String(p||'').match(/(\d+)\s*kom/i);return m?(+m[1]||1):1;}
function costOf(p){return setx().mat*qtyOf(p);}
function calcMonth(m){
  var S=setx(),r={prihod:0,mat:0,povratMat:0,post:0,ads:0,fiksni:S.fiksni,cnt:{},poslato:0,vraceno:0,prag:S.prag};
  D.orders.forEach(function(o){
    if(o.mesec!==m)return;
    r.cnt[o.status]=(r.cnt[o.status]||0)+1;
    var c=(o.status==='Isporučeno'||o.status==='Preuzeto'||o.status==='Čeka preuzimanje');
    if(o.status==='Vraćeno'||o.status==='Vraća se'){ if(o.status==='Vraćeno'){r.povratMat+=costOf(o.proizvod);r.vraceno++;} }
    else if(c){r.prihod+=Math.round(o.cena);r.mat+=costOf(o.proizvod);}
    if(String(o.d2||'').trim())r.poslato++;
  });
  r.post=S.post*r.poslato;
  D.ads.forEach(function(a){if(!a.mesec||a.mesec===m)r.ads+=Math.round(a.rsd);});
  r.profit=r.prihod-(r.mat+r.post+r.ads+r.povratMat+r.fiksni);
  r.cilj=S.cilj;
  return r;
}
function naPutu(){
  var S=setx(),lw=isWork(TODAY)?TODAY:prevWork(TODAY),lws=dmy(lw);
  var k={n:0,s:0,p:0},p={n:0,s:0,p:0};
  D.orders.forEach(function(o){
    var pr=Math.round(o.cena)-costOf(o.proizvod)-S.post;
    if(o.status==='Preuzeto'||o.status==='Čeka preuzimanje'){k.n++;k.s+=Math.round(o.cena);k.p+=pr;}
    else if(o.status==='Isporučeno'&&String(o.d3||'').slice(0,10)===lws){p.n++;p.s+=Math.round(o.cena);p.p+=pr;}
  });
  return {kurir:k,juce:p,lw:lw};
}

function rowOf(sifra){return D.lager.filter(function(r){return r.sifra===sifra;})[0]||null;}
function mkItem(b,row){
  var o=Object.assign({},b);row=row||{};
  o.knjiga=row.stanje==null?0:Number(row.stanje);o.stock=Math.max(0,o.knjiga);o.ima=row.stanje!=null;
  o.dnevno=row.dnevno==null?null:Number(row.dnevno);
  return o;
}
function buildItems(){
  return CONFIG.BOM.map(function(b){return mkItem(b,rowOf(b.sifra||b.id));});
}
function buildFil(){
  return D.lager.filter(function(r){return /^pla_/.test(r.sifra||'');}).map(function(r){
    var per=CONFIG.FIL_PO_LAMPI[r.sifra]||0;
    return mkItem({id:r.sifra,naziv:String(r.naziv||r.sifra).replace(/^PLA\s*/i,'PLA '),unit:'kg',per:per,pack:CONFIG.ROLNA_KG,fil:true},r);
  }).sort(function(a,b){return (b.dnevno||0)-(a.dnevno||0);});
}
function buildInc(){
  var inc=[];
  D.nabavke.forEach(function(n){
    var lines=CONFIG.RASPODELA[n.izvor_kljuc]||(n.sifra&&n.kolicina?[{it:n.sifra,q:Number(n.kolicina)}]:[]);
    inc.push({id:'n'+n.id,naslov:n.naziv,datum:null,lines:lines,extra:lines.length?'':'Nema raspodele po materijalima, ne računa se u lager.',iz:'baza'});
  });
  CONFIG.EXTRA_INC.forEach(function(e){if((D.prim||[]).indexOf('prijem:'+e.id)>=0)return;inc.push({id:e.id,naslov:e.naslov,datum:e.datum?isoToDate(e.datum):null,lines:e.lines,extra:e.extra||'',iz:'ručno'});});
  return inc;
}
function state(){
  var items=buildItems(),fil=buildFil(),inc=[],all=items.concat(fil);

    inc.push(p);
  });

}
function roundUp(q,p){return Math.max(p,Math.ceil(q/p-1e-9)*p);}
function decOf(u){return (u==='kg'||u==='m²')?2:0;}
/* Tempo = stvarna potrošnja iz baze (v_lager.dnevno, prosek 14 dana). */
function plan(it){
  var res={last:null,acts:[],level:'g',dana:null};
  res.lampi=it.per>0?Math.floor(it.stock/it.per):null;
  var t=it.dnevno;
  if(!t||t<=0){res.acts.push('Ne trošiš ga u poslednje 2 nedelje.');return res;}
  var dana=Math.floor(it.stock/t+1e-9);res.dana=dana;
  res.last=add(TODAY,dana);
  var rok=add(res.last,-CONFIG.ROK_DANA);
  var qty=roundUp(CONFIG.ZALIHA_DANA*t,it.pack),u=it.unit,dec=decOf(u);
  var tempo=t<0.01?'Skoro ga ne trošiš. ':'Trošiš oko '+nf(t,t<1?2:1)+' '+u+' dnevno. ';
  if(dana>30){res.acts.push(tempo+'Dovoljno za više od mesec dana.');return res;}
  if(!isWork(rok))rok=prevWork(rok);
  res.acts.push(tempo+(dana<=0?'Već je nestalo.':'Ovim tempom nestaje '+fd(res.last)+' (za '+dana+' '+(dana===1?'dan':'dana')+').'));
  if(rok<=TODAY){res.level='r';res.acts.push('Naruči danas: '+nf(qty,dec)+' '+u+'.');}
  else{res.level=(dayDiff(rok,TODAY)<=3||dana<=7)?'y':'g';res.acts.push('Naruči najkasnije '+fd(rok)+': '+nf(qty,dec)+' '+u+'.');}
  return res;
}
function dayDiff(a,b){return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);}
function rollSvg(frac,col){
  var r=15,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
    '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 20 20)"/>'+
    '<circle cx="20" cy="20" r="'+(r+4.5)+'" fill="none" stroke="var(--mut)" stroke-opacity=".5" stroke-width="1"/><circle cx="20" cy="20" r="5" fill="var(--card2)" stroke="var(--line)"/></svg>';
}

  var s=0;D.ads.forEach(function(a){if(ds.indexOf(a.datum)>=0)s+=Number(a.rsd)||0;});

function presuda(sp7,kup7,freq,ctr,ctrPret,db){
  var cilj=(D.settings&&D.settings.ciljni_cpa)||1100,cpa=kup7?sp7/kup7:null;
  if(db==='SKALIRATI')return ['g','Ide odlično. Možeš da povećaš budžet.'];
  if(db==='UGASITI')return ['r','Ugasi je. Košta više nego što zaradi.'];
  if(sp7<2200)return ['y','Još je rano. Premalo je potrošeno da bi se znalo, pusti je.'];
  if(freq>2.5&&ctrPret&&ctr<ctrPret*0.8)return ['y','Ljudi su je se zasitili. Snimi novi video.'];
  if(cpa==null)return ['r','Troši, a nema prodaje. Ugasi je.'];

function bezKv(t){return String(t||'').toLowerCase().replace(/č|ć/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'dj');}
var BOJE=[['crn','pla_crna'],['bel','pla_bela'],['crven','pla_crvena'],['plav','pla_plava'],['zlat','pla_zlatna'],['siv','pla_siva'],['zelen','pla_zelena'],['narandz','pla_narandzasta'],['zut','pla_zuta'],['roz','pla_roze']];
function nadjiStavku(t){
  if(/usb|kabl/.test(t))return 'usb';
  if(/\bled\b|trak/.test(t))return 'led';
  if(/kutij/.test(t))return 'kutija';
  if(/folij|pucket/.test(t))return 'folija';
  for(var i=0;i<BOJE.length;i++)if(t.indexOf(BOJE[i][0])>=0)return BOJE[i][1];
  return null;
}
function parsiraj(txt){
  var out=[];
  bezKv(txt).split(/,(?!\d)|;|\s+i\s+(?=\D)|\n/).forEach(function(d){
    d=d.trim();if(!d)return;
    var prijem=/stigl|primi|primljen|dosl|kupi|dodaj|\+/.test(d),m=d.match(/(\d+(?:[.,]\d+)?)/);
    var s=nadjiStavku(d);
    var q=m?parseFloat(m[1].replace(',','.')):null;
    if(q!=null&&/roln/.test(d)&&/^pla_/.test(s||''))q=q*CONFIG.ROLNA_KG;
    var row=s?rowOf(s):null;
    out.push({tekst:d,sifra:s,q:q,prijem:prijem,ok:!!(s&&row&&q!=null),row:row});
  });
  return out;
}
var DIK=[];
function diktPregled(){
  var t=document.getElementById('dik').value;DIK=parsiraj(t);var h='';
  DIK.forEach(function(x){
    if(!x.sifra){h+='<div class="line"><span>„'+esc(x.tekst)+'“</span><b style="color:var(--r)">Ne znam šta je</b></div>';return;}
    if(!x.row){h+='<div class="line"><span>„'+esc(x.tekst)+'“</span><b style="color:var(--r)">Nema u bazi</b></div>';return;}
    if(x.q==null){h+='<div class="line"><span>„'+esc(x.tekst)+'“</span><b style="color:var(--r)">Fali broj</b></div>';return;}
    var st=Number(x.row.stanje)||0,u=x.row.jed||(/^pla_/.test(x.sifra)?'kg':''),dec=decOf(u==='m2'?'m²':u),nov=x.prijem?st+x.q:x.q;
    h+='<div class="line"><span><b>'+esc(x.row.naziv)+'</b><div class="sm">'+(x.prijem?'Stiglo +'+nf(x.q,dec):'Imam '+nf(x.q,dec))+' · bilo '+nf(st,dec)+'</div></span><b>→ '+nf(nov,dec)+' '+esc(u)+'</b></div>';
  });
  var dobri=DIK.filter(function(x){return x.ok;}).length;
  document.getElementById('dikout').innerHTML=h+(dobri?'<button class="btn" onclick="diktUpisi()">Upiši ('+dobri+')</button>':'');
}
async function diktUpisi(){
  var dobri=DIK.filter(function(x){return x.ok;}),rez=[];
  for(var i=0;i<dobri.length;i++){var x=dobri[i];
    var r=x.prijem?await SB.rpc('lager_prijem',{p_sifra:x.sifra,p_kolicina:x.q,p_napomena:'diktirano: '+x.tekst}):await SB.rpc('lager_popis',{p_sifra:x.sifra,p_kolicina:x.q,p_napomena:'diktirano: '+x.tekst});

    inp('s_cilj','Cilj profita mesečno',s.cilj_mesecni||150000,'RSD')+
    inp('s_cpa','Ciljna cena po prodaji',s.ciljni_cpa||1100,'RSD')+
    inp('s_prag','Dozvoljen povrat',Math.round((s.prag_povrata!=null?s.prag_povrata:0.05)*100),'%')+'</div></div><div>'+
    '<div class="panel"><h2>Koliko lampi šalješ dnevno</h2>'+[1,2,3,4,5].map(function(d){return inp('s_k'+d,['','Ponedeljak','Utorak','Sreda','Četvrtak','Petak'][d],k[d]!=null?k[d]:0,'kom');}).join('')+'</div>'+
    '<div class="panel"><h2>Fiksni troškovi mesečno</h2><div id="fiks">'+f.map(function(x,i){return fiksRed(x.naziv,x.mesecno);}).join('')+'</div>'+
    '<button class="btn ghost" onclick="document.getElementById(\'fiks\').insertAdjacentHTML(\'beforeend\',fiksRed(\'\',0))">+ Dodaj trošak</button></div></div></div>'+
    '<button class="btn" onclick="podSacuvaj()">Sačuvaj</button><p class="sm">Ista podešavanja koristi i stari program, pa se promena vidi u oba.</p>';
  return h;
}
function fiksRed(n,v){return '<div class="line fr" style="align-items:center;gap:8px"><input class="fn" value="'+esc(n)+'" placeholder="Naziv" style="flex:1;min-width:0;font:600 16px var(--body);padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink)"><input class="fv" type="number" value="'+esc(v)+'" style="width:78px;text-align:right;font:700 16px var(--body);padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink)"><button class="ibtn" style="width:36px;height:36px" onclick="this.parentNode.remove()" aria-label="Obriši">×</button></div>';}
async function podSacuvaj(){
  var v=function(id){var x=parseFloat(String(document.getElementById(id).value).replace(',','.'));return isNaN(x)?null:x;};
  var s=D.settings||{},pr=(s.proizvodi&&s.proizvodi.length?JSON.parse(JSON.stringify(s.proizvodi)):[{tip:'Lampa',cena:900}]);pr[0].cena=v('s_mat');
  var k={};[1,2,3,4,5].forEach(function(d){k[d]=v('s_k'+d)||0;});
  var fx=[];document.querySelectorAll('#fiks .fr').forEach(function(r){var n=r.querySelector('.fn').value.trim(),m=parseFloat(r.querySelector('.fv').value);if(n&&!isNaN(m))fx.push({naziv:n,mesecno:m});});
  var p={postarina:v('s_post'),povratna_postarina:v('s_ppost'),proizvodi:pr,cilj_mesecni:v('s_cilj'),ciljni_cpa:v('s_cpa'),prag_povrata:(v('s_prag')||0)/100,kapacitet_po_danu:k,fiksni_troskovi:fx};
  for(var key in p){if(p[key]===null){alert('Proveri polje: '+key);return;}}
  if(!confirm('Sačuvati podešavanja? Važi i za stari program.'))return;
  var r=await SB.rpc('sacuvaj_podesavanja',{p:p});
  if(r.error){alert('Nije sačuvano: '+r.error.message);return;}
  poruka('Sačuvano.');await ucitaj();render();go('p-pod');
}
function promeniMesec(m){MESEC=m;render();}

/* ---------- učitavanje (samo čitanje) ---------- */
function sbInit(){if(!SB)SB=supabase.createClient(CONFIG.SUPA_URL,CONFIG.SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:CONFIG.AUTH_KEY}});return SB;}
function ok(r,def){return r&&!r.error&&r.data?r.data:def;}
async function ucitaj(){
  var sb=sbInit();
  var r=await Promise.all([
    sb.from('orders').select('broj,kupac,proizvod,cena,d1,d2,d3,status,mesec'),
    sb.from('ad_spend').select('datum,mesec,usd,rsd'),
    sb.from('app_state').select('key,data').eq('key','settings'),
    sb.from('v_lager').select('*'),
    sb.from('v_paketomat').select('*'),
    sb.from('stanje_racuna').select('*').order('datum',{ascending:false}).limit(1),
    sb.from('nabavke').select('*').eq('stigla',false),
    sb.from('v_reklame').select('*'),
    sb.from('tasks').select('*').neq('status','zavrseno'),
    sb.from('inventory_movements').select('izvor_kljuc').like('izvor_kljuc','prijem:%'),
    sb.from('analyses').select('datum,period,naslov,zakljucak_tekst').order('datum',{ascending:false}).limit(12),
    sb.from('ad_metrics').select('datum,ad_id,ad_name,campaign_name,spend_rsd,purchases,frequency,ctr').gte('datum',dmyIso(add(TODAY,-20)))
  ]);
  if(r[0].error||r[1].error)throw new Error((r[0].error||r[1].error).message);
  D.orders=r[0].data||[];D.ads=r[1].data||[];
  var st=ok(r[2],[]);D.settings=(st[0]&&st[0].data)||{};
  D.lager=ok(r[3],[]);D.pak=ok(r[4],[]);D.racun=(ok(r[5],[])[0])||null;
  D.nabavke=ok(r[6],[]);D.rek=ok(r[7],[]);D.tasks=ok(r[8],[]);D.prim=ok(r[9],[]).map(function(x){return x.izvor_kljuc;});D.an=ok(r[10],[]);D.adm=ok(r[11],[]);
  var set={};D.orders.forEach(function(o){if(o.mesec)set[o.mesec]=1;});D.ads.forEach(function(a){if(a.mesec)set[a.mesec]=1;});
  var ms=Object.keys(set).sort(function(a,b){return monthKey(b)-monthKey(a);});
  var cur=monthOf(TODAY);
  if(!MESEC||ms.indexOf(MESEC)<0)MESEC=ms.indexOf(cur)>=0?cur:ms[0];
  document.getElementById('mesec').innerHTML=ms.map(function(m){return '<option'+(m===MESEC?' selected':'')+'>'+m+'</option>';}).join('');
}
async function osvezi(){TODAY=new Date();try{await ucitaj();render();}catch(e){alert('Greška pri učitavanju: '+e.message);}}
async function prijava(){
  document.getElementById('err').textContent='Prijavljivanje...';
  var r=await sbInit().auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  if(r.error){document.getElementById('err').textContent='Prijava nije uspela: '+r.error.message;return;}
  start();
}
async function start(){
  document.getElementById('hb').innerHTML=IC.bulb;document.getElementById('lb').innerHTML=IC.bulb;document.getElementById('rf').innerHTML=IC.refresh;document.getElementById('gear').innerHTML=IC.gear;
  var g=await sbInit().auth.getSession(),sess=g&&g.data?g.data.session:null;
  if(!sess){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';return;}
  document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
  try{await ucitaj();render();}catch(e){document.getElementById('app').style.display='none';document.getElementById('login').style.display='block';document.getElementById('err').textContent='Sesija je istekla ili greška: '+e.message;}
}
start();
</script>
