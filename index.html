<script>
const LS_EXP="3dm_expenses_v1", LS_LAG="3dm_lager_v1", LS_URL="3dm_csv_url", LS_SET="3dm_settings_v1", LS_CONF="3dm_confirm_v1", LS_POV="3dm_povrati_v1";

const STATUS_META={"Isporučeno":{c:"#0f8a4d",b:"#e4f6ec"},"Preuzeto":{c:"#1f6fd6",b:"#e6f0fd"},"Čeka preuzimanje":{c:"#b9791a",b:"#fdf1dd"},"U obradi":{c:"#7a4ddb",b:"#efe8fd"},"Vraćeno":{c:"#c4332b",b:"#fce8e6"},"Vraća se":{c:"#e0a32e",b:"#fdf1dd"},"Nacrt":{c:"#6b7280",b:"#eef0f4"}};

const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1d2tjZGZzZmxocHRhZ2dhc2J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTA1NzUsImV4cCI6MjA5NDU4NjU3NX0.Eh3Y0aF4xcAwfKduIgVzKjXItow5mPChk93YEz6KMIU";

function dbSave(ls){const dbk=DBKEYS[ls];if(!dbk)return;fetch(SUPA_URL+"/rest/v1/app_state",{method:"POST",headers:Object.assign({},SUPA_H,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({key:dbk,data:lsGet(ls,null),updated_at:new Date().toISOString()})}).catch(()=>{});}
async function dbLoadAll(){try{const r=await fetch(SUPA_URL+"/rest/v1/app_state?select=key,data",{headers:SUPA_H,cache:"no-store"});if(!r.ok)return false;const rows=await r.json();const map={};rows.forEach(x=>map[x.key]=x.data);for(const ls in DBKEYS){const dbk=DBKEYS[ls];if(map[dbk]!==undefined){_lsSetRaw(ls,map[dbk]);}else if(localStorage.getItem(ls)!==null){dbSave(ls);}}return true;}catch(e){return false;}}
function settings(){let s=lsGet(LS_SET,null);if(!s){s=JSON.parse(JSON.stringify(DEF_SET));lsSet(LS_SET,s);}if(!s.proizvodi||!s.proizvodi.length)s.proizvodi=[{tip:"Lampa",cena:600}];if(typeof s.postarina!=="number")s.postarina=390;if(!s.komponente)s.komponente=[];return s;}
function monthOf(d){const m=String(d).match(/^(\d{2})\.(\d{2})\.(\d{4})/);return m?MONTHS[+m[2]]+" "+m[3]:null;}
function ts(d){const m=String(d).match(/(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime():0;}
function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear();}
function qtyOf(prod){const m=String(prod).match(/(\d+)\s*kom/i);return m?(+m[1]||1):1;}
function tipOf(prod){const s=settings(),p=String(prod).toLowerCase();for(const it of s.proizvodi){if(it.tip&&p.includes(it.tip.toLowerCase()))return it;}return s.proizvodi[0];}
function costOf(prod){return (tipOf(prod).cena||0)*qtyOf(prod);}
function baseProfit(o){return o.cena-settings().postarina-costOf(o.prod);}
function profitInfo(o){if(o.status==="Vraćeno")return{v:-settings().postarina,real:true};if(o.status==="Isporučeno")return{v:baseProfit(o),real:true};if(o.status==="Vraća se")return{v:-settings().postarina,real:false};return{v:baseProfit(o),real:false};}
const CONFIRMED={};function isConfirmed(o){return false;}
function profDay(o){if(o.status==="Isporučeno")return baseProfit(o);if(o.status==="Vraćeno")return -settings().postarina;if(o.status==="Preuzeto"||o.status==="Čeka preuzimanje")return baseProfit(o);if(o.status==="U obradi")return baseProfit(o);return 0;}
function parseCSV(t){const rows=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
 else{if(c==='"')q=true;else if(c===','){row.push(cur);cur="";}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}else if(c==='\r'){}else cur+=c;}}
 if(cur!==""||row.length){row.push(cur);rows.push(row);}return rows;}
function extract(rows){
  rows=rows.map(r=>r.map(x=>(x||"").trim()));
  const orders=[],ads=[];
  let oi=rows.findIndex(r=>r.includes("Broj narudžbine"));
  if(oi>=0){const h=rows[oi],ix=n=>h.indexOf(n);
    const c={mesec:ix("Mesec"),br:ix("Br"),broj:ix("Broj narudžbine"),kupac:ix("Kupac"),prod:ix("Proizvod"),cena:ix("Cena (RSD)"),d1:ix("Datum naručeno"),d2:ix("Datum poslat kuriru"),d3:ix("Datum preuzeo kupac"),st:ix("Status")};
    for(let i=oi+1;i<rows.length;i++){const r=rows[i]; if(!r[c.br]||!/^\d+$/.test(r[c.br]))break;
      orders.push({mesec:r[c.mesec],br:+r[c.br],broj:r[c.broj],kupac:r[c.kupac],prod:r[c.prod],cena:num(r[c.cena]),d1:r[c.d1],d2:r[c.d2],d3:r[c.d3],status:r[c.st]});}}
  let ai=rows.findIndex(r=>r.includes("USD")&&r.includes("RSD"));
  if(ai>=0){const h=rows[ai],mi=h.indexOf("Mesec"),di=h.indexOf("Datum"),ui=h.indexOf("USD"),ri=h.indexOf("RSD");
    for(let i=ai+1;i<rows.length;i++){const r=rows[i]; if(!r[di]||!/^\d{2}\.\d{2}\.\d{4}$/.test(r[di]))break;
      ads.push({mesec:mi>=0?r[mi]:null,datum:r[di],usd:parseFloat(r[ui])||0,rsd:num(r[ri])});}}
  return {orders,ads};
}
function allMonths(){const s=new Set();STATE.orders.forEach(o=>o.mesec&&s.add(o.mesec));STATE.ads.forEach(a=>a.mesec&&s.add(a.mesec));lsGet(LS_EXP,[]).forEach(e=>e.mesec&&s.add(e.mesec));return [...s];}
function buildMonthSelect(){const sel=document.getElementById("month");const ms=allMonths();if(!ms.length){sel.innerHTML="";return;}if(!STATE.month||!ms.includes(STATE.month))STATE.month=(ms.includes(monthOf(todayStr()))?monthOf(todayStr()):ms[0]);sel.innerHTML=ms.map(m=>`<option ${m===STATE.month?"selected":""}>${m}</option>`).join("");}
function tabsBar(){const t=[["pregled","Pregled"],["narudzbine","Narudžbine"],["reklame","Reklame"],["troskovi","Troškovi"],["lager","Lager"],["podesavanja","Podešavanja"]];document.getElementById("tabs").innerHTML=t.map(([k,l])=>`<button class="tab ${STATE.tab===k?"active":""}" data-t="${k}">${l}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{STATE.tab=b.dataset.t;STATE.statusFilter=null;render();});}
function danaUMesecu(m){var M={januar:0,februar:1,mart:2,april:3,maj:4,jun:5,jul:6,avgust:7,septembar:8,oktobar:9,novembar:10,decembar:11};var p=String(m).split(" ");var mi=M[p[0]],y=+p[1];if(mi==null||!y)return 30;return new Date(y,mi+1,0).getDate();}
function danUMesecu(s){var t=String(s||"").trim();var mm=t.match(/^(\d{2})\./);return mm?+mm[1]:0;}
function serijaProfita(m,ords,ads){
 var D=danaUMesecu(m),S=settings(),PB=S.postarina||390,POV=lsGet(LS_POV,{});
 var fiksni=(S.fiksni_troskovi||[]).reduce(function(s,f){return s+(+f.mesecno||0);},0);
 var d=new Array(D+1).fill(0);
 function idx(x){var v=danUMesecu(x);if(!v)return 1;return Math.min(Math.max(v,1),D);}
 ords.forEach(function(o){var kom=qtyOf(o);
  if(o.status==="Isporučeno"||o.status==="Preuzeto"||o.status==="Čeka preuzimanje"){var i=idx(o.d3||o.d2||o.d1);d[i]+=(+o.cena||0)-900*kom;}
  if((o.d2||"").trim()){d[idx(o.d2)]-=PB;}
  if(o.status==="Vraćeno"&&!POV[o.broj]){d[idx(o.d3||o.d2||o.d1)]-=900*kom;}
 });
 ads.forEach(function(a){var v=String(a.datum||"");var dd=+v.slice(0,2);if(dd)d[Math.min(Math.max(dd,1),D)]-=(+a.rsd||0);});
 for(var i=1;i<=D;i++)d[i]-=fiksni/D;
 var kum=[],s=0;for(var j=1;j<=D;j++){s+=d[j];kum.push(Math.round(s));}
 return {dana:D,kum:kum};
}
function asistentStavke(m,cista,ords){
 var L=window.LAGER2||[],out=[],S=settings(),cilj=+((S&&S.cilj_mesecni)||150000);
 var D=danaUMesecu(m),dan=Math.min(new Date().getDate(),D),now=ts(todayStr()),DAY=86400000;
 function dS(d){var x=ts(d);return x?Math.floor((now-x)/DAY):null;}
 function det(r){return r.naziv+" — stanje "+r.stanje+" "+r.jed+", još oko "+(r.dani_do_nestanka==null?"?":r.dani_do_nestanka)+" dana (potrošnja "+(r.dnevno==null?"?":r.dnevno)+" "+r.jed+"/dan, "+r.izvor_potrosnje+")";}

  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const a=lsGet(LS_LAG,[]);a[+b.dataset.dec].kol=(parseFloat(a[+b.dataset.dec].kol)||0)-1;save(a);render();});
  document.querySelectorAll("[data-rem]").forEach(b=>b.onclick=()=>{if(!confirm("Obrisati stavku?"))return;const a=lsGet(LS_LAG,[]);a.splice(+b.dataset.rem,1);save(a);render();});

}

    </div>

      <table><thead><tr><th>Tip proizvoda</th><th class="num">Cena izrade</th><th></th></tr></thead><tbody>${prod}</tbody></table>
      <div class="formrow" style="margin-top:10px"><div class="f"><label>Novi tip</label><input class="inp" id="p_tip" placeholder="npr. Držač" size="14"></div><div class="f"><label>Cena (RSD)</label><input class="inp" id="p_cena" placeholder="0" size="7" inputmode="numeric"></div><button class="btn primary" id="p_add">+ Dodaj</button></div>

  document.getElementById("s_postsave").onclick=()=>{const v=num(val("s_post"));const x=settings();x.postarina=v;lsSet(LS_SET,x);render();};

  document.querySelectorAll("[data-pc]").forEach(inp=>inp.onchange=()=>{const x=settings();x.proizvodi[+inp.dataset.pc].cena=num(inp.value);lsSet(LS_SET,x);});
  document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const x=settings();x.proizvodi.splice(+b.dataset.pr,1);lsSet(LS_SET,x);render();});
  document.getElementById("p_add").onclick=()=>{const t=val("p_tip");if(!t)return;const x=settings();x.proizvodi.push({tip:t,cena:num(val("p_cena"))});lsSet(LS_SET,x);render();};
  document.querySelectorAll("[data-kn]").forEach(inp=>inp.onchange=()=>{const x=settings();x.komponente[+inp.dataset.kn].naziv=inp.value.trim();lsSet(LS_SET,x);});
  document.querySelectorAll("[data-kj]").forEach(inp=>inp.onchange=()=>{const x=settings();x.komponente[+inp.dataset.kj].jed=inp.value.trim();lsSet(LS_SET,x);});

function renderObrada(){
  const m=STATE.month;
  const ords=STATE.orders.filter(o=>o.mesec===m && o.status==="U obradi").sort((a,b)=>ts(b.d1)-ts(a.d1));
  const conf=Object.fromEntries(STATE.orders.filter(o=>isConfirmed(o)).map(o=>[o.broj,1]));
  const tally={};
  ords.forEach(o=>{const q=qtyOf(o.prod);o.prod.split("+").map(x=>x.trim()).forEach((p,idx)=>{let name=p.replace(/\s*\(.*?\)/g,"").trim();if(!name)return;tally[name]=(tally[name]||0)+(idx===0?q:1);});});
  const tallyHtml=Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f1f4;font-size:14px"><span>${k}</span><b style="font-size:16px">${v}</b></div>`).join("")||'<div class="muted">nema</div>';
  const confCount=ords.filter(o=>conf[o.broj]).length;
  const list=ords.map(o=>{const c=!!conf[o.broj];
    return `<tr style="${c?'background:#eafaf0':''}"><td><input type="checkbox" data-cf="${o.broj}" ${c?'checked':''} style="width:20px;height:20px"></td><td class="nowrap">${o.broj}</td><td>${o.kupac}</td><td class="col-proizvod">${o.prod}</td><td class="num">${o.cena.toLocaleString("sr-RS")}</td><td class="nowrap">${o.d1}</td></tr>`;}).join("");
  document.getElementById("app").innerHTML=`
    <div class="twocol">
      <div class="panel"><h2>Potvrda narudžbina — SMS (${confCount}/${ords.length} potvrđeno)</h2>
        <div class="muted" style="font-size:11px;margin-bottom:8px">Čekiraj kad ti kupac potvrdi porudžbinu preko SMS-a. Čuva se na ovom uređaju.</div>
        <div class="tableScroll"><table><thead><tr><th>✓</th><th>Narudžbina</th><th>Kupac</th><th class="col-proizvod">Proizvod</th><th class="num">Cena</th><th>Naručeno</th></tr></thead><tbody>${list||'<tr><td colspan="6" class="muted">nema u obradi</td></tr>'}</tbody></table></div>
      </div>
      <div class="panel"><h2>Za izradu (${ords.length} por.)</h2><div class="muted" style="font-size:11px;margin-bottom:8px">Koliko čega da napraviš za sve „U obradi".</div>${tallyHtml}</div>
    </div>`;
  
}
function render(){buildMonthSelect();tabsBar();if(STATE.tab==="pregled"||STATE.tab==="narudzbine")renderPregled();else if(STATE.tab==="reklame")renderReklame();else if(STATE.tab==="troskovi")renderTroskovi();else if(STATE.tab==="lager")renderLager();else renderSettings();}
function exportData(){const data={expenses:lsGet(LS_EXP,[]),lager:lsGet(LS_LAG,[]),settings:settings()};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="3dm-backup.json";a.click();}
async function load(){
  localStorage.removeItem(LS_URL);
  document.getElementById("boot").classList.remove("hide");
  document.getElementById("boot").className="center";
  document.getElementById("boot").textContent="⏳ Učitavam…";
  let synced=false;
  try{ synced=await dbLoadAll(); }catch(e){}
  try{
    const r=extract(parseCSV(EMBEDDED_CSV));
    STATE.orders=r.orders; STATE.ads=r.ads;
    document.getElementById("boot").classList.add("hide");
    document.getElementById("sub").textContent=(synced?"☁ Sinhronizovano (baza)":"⚠ Bez baze (lokalno)")+" • profit iz Podešavanja • narudžbine 23.09.2026";
    render();
  }catch(e){document.getElementById("boot").className="center err";document.getElementById("boot").textContent="Greška: "+e.message;}
}

/* ===== AUTH + DB (Faza 1) ===== */
var SB=null, SB_USER=null;
function sbInit(){ if(!SB) SB=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"3dm_auth"}}); return SB; }
async function dbLoadAll(){ return true; }
function setAppVisible(v){ Array.prototype.forEach.call(document.body.children,function(el){ if(el.id!=="loginBox"&&el.tagName!=="SCRIPT") el.style.display = v?"":"none"; }); }
function dmy(iso){ if(!iso) return ""; var p=String(iso).slice(0,10).split("-"); return p.length===3?(p[2]+"."+p[1]+"."+p[0]):""; }
function csvEsc(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; }
async function ucitajIzBaze(){ var sb=sbInit();
  var res=await Promise.all([sb.from("orders").select("broj,kupac,proizvod,cena,d1,d2,d3,status,mesec"), sb.from("ad_spend").select("datum,mesec,usd,rsd"), sb.from("app_state").select("key,data")]);
  var o=res[0],a=res[1],s=res[2];
  try{var lg=await Promise.all([sb.from("v_lager").select("*"),sb.from("v_kapacitet").select("*"),sb.from("v_bom_cena").select("*")]);window.LAGER2=lg[0].data||[];window.KAPACITET=lg[1].data||[];window.BOMCENA=lg[2].data||[];var tk=await sb.from("tasks").select("*").neq("status","zavrseno");window.TASKS=tk.data||[];var an=await sb.from("analyses").select("*").order("datum",{ascending:false}).limit(1);window.ANALIZA=(an.data&&an.data[0])||null;var rk=await Promise.all([sb.from("v_reklame").select("*"),sb.from("ad_knowledge").select("*").order("datum",{ascending:false}).limit(20)]);window.REKLAME=rk[0].data||[];window.ZNANJE=rk[1].data||[];}catch(e){window.LAGER2=[];window.KAPACITET=[];window.BOMCENA=[];window.TASKS=[];window.ANALIZA=null;window.REKLAME=[];window.ZNANJE=[];}
  if(o.error||a.error||s.error) throw new Error((o.error||a.error||s.error).message);
  var map={}; (s.data||[]).forEach(function(r){map[r.key]=r.data;});
  var back={expenses:LS_EXP,lager:LS_LAG,settings:LS_SET,confirm:LS_CONF,povrati:LS_POV};
  for(var k in back){ if(map[k]!==undefined) _lsSetRaw(back[k],map[k]); }
  var rows=(o.data||[]).slice().sort(function(x,y){return ts(y.d1)-ts(x.d1);});
  var out="Mesec,Br,Broj narudžbine,Kupac,Proizvod,Cena (RSD),Datum naručeno,Datum poslat kuriru,Datum preuzeo kupac,Status,Profit (RSD)";
  rows.forEach(function(r,i){ out+="\n"+[r.mesec,i+1,r.broj,r.kupac,r.proizvod,Math.round(r.cena),r.d1||"",r.d2||"",r.d3||"",r.status,""].map(csvEsc).join(","); });
  out+="\n\nMesec,Datum,USD,RSD";
  (a.data||[]).slice().sort(function(x,y){return String(x.datum).localeCompare(String(y.datum));}).forEach(function(r){ out+="\n"+[r.mesec,dmy(r.datum),r.usd,Math.round(r.rsd)].map(csvEsc).join(","); });
  EMBEDDED_CSV=out; }
function prikaziLogin(p){ setAppVisible(false); var b=document.getElementById("loginBox"); b.style.display="flex"; if(p) document.getElementById("loginErr").textContent=p; }
async function uradiLogin(){ var em=document.getElementById("loginEmail").value.trim(), pw=document.getElementById("loginPass").value;
  document.getElementById("loginErr").textContent="Prijavljivanje..."; 
  var r=await sbInit().auth.signInWithPassword({email:em,password:pw});
  if(r.error){ document.getElementById("loginErr").textContent="Neuspešna prijava: "+r.error.message; return; }
  SB_USER=r.data.user; if(!document.getElementById("loginRemember").checked){ window.addEventListener("beforeunload",function(){ try{sbInit().auth.signOut();}catch(e){} }); }
  document.getElementById("loginBox").style.display="none"; setAppVisible(true);
  try{ await ucitajIzBaze(); load(); }catch(err){ alert("Greška pri učitavanju: "+err.message); } }
async function promeniSifru(){ var n=prompt("Nova šifra (min 8 znakova):"); if(!n) return; if(n.length<8){alert("Prekratka šifra.");return;}
  var r=await sbInit().auth.updateUser({password:n}); alert(r.error?("Greška: "+r.error.message):"Šifra je promenjena."); }
async function odjaviSe(){ await sbInit().auth.signOut(); location.reload(); }
var _origRender=render;
render=function(){ _origRender.apply(this,arguments); try{ if(STATE.tab==="podesavanja"&&!document.getElementById("authPanel")){ var d=document.createElement("div"); d.className="panel"; d.id="authPanel"; d.innerHTML='<h2>Nalog</h2><div class="muted" style="font-size:12px;margin-bottom:8px">Prijavljen: '+((SB_USER&&SB_USER.email)||"")+'</div><button class="btn" id="btnPass">Promeni šifru</button> <button class="btn" id="btnOut">Odjavi se</button>'; document.getElementById("app").appendChild(d); document.getElementById("btnPass").onclick=promeniSifru; document.getElementById("btnOut").onclick=odjaviSe; } }catch(e){} };
async function bootAuth(){ setAppVisible(false);
  var sb=sbInit(); var g=await sb.auth.getSession(); var sess=g&&g.data?g.data.session:null;
  document.getElementById("loginBtn").onclick=uradiLogin;
  document.getElementById("loginPass").addEventListener("keydown",function(ev){ if(ev.key==="Enter") uradiLogin(); });
  document.getElementById("loginEmail").addEventListener("keydown",function(ev){ if(ev.key==="Enter") document.getElementById("loginPass").focus(); });
  if(!sess){ prikaziLogin(""); return; }
  SB_USER=sess.user; document.getElementById("loginBox").style.display="none"; setAppVisible(true);
  try{ await ucitajIzBaze(); load(); }catch(err){ await sb.auth.signOut(); prikaziLogin("Sesija je istekla. Prijavi se ponovo."); } }
bootAuth();
</script>
